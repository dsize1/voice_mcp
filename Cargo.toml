[workspace]
resolver = "3"
members = ["crates/voice-core", "crates/voice-mcp", "crates/voice-cli", "crates/spike"]
# P0 验证用小程序不进默认构建（需要时 -p spike 显式构建）
default-members = ["crates/voice-core", "crates/voice-mcp", "crates/voice-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
# 实测通过的最低版本；见 rust-toolchain.toml 与 ADR-0008 D19
rust-version = "1.99"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hound = "3"
symphonia = { version = "0.5", default-features = false, features = [
    "aac",
    "isomp4",
    "wav",
    "pcm",
    "mp3",
    "flac",
    "ogg",
    "vorbis",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
