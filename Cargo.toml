[workspace]
resolver = "3"
members = ["crates/voice-core", "crates/voice-mcp", "crates/voice-cli", "crates/spike"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hound = "3"
symphonia = { version = "0.5", default-features = false, features = [
    "aac",
    "isomp4",
    "wav",
    "pcm",
    "mp3",
    "flac",
    "ogg",
    "vorbis",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
